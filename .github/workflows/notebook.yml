name: Run Sudan 2022 notebook
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ipykernel install --user --name python3
      - run: python run_notebook.py --kernel python3
      - uses: actions/upload-artifact@v4
        with:
          name: sudan-2022-executed
          path: |
            Sudan_2022.ipynb
            Sudan_2022.html
            results/

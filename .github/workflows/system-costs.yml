name: Check system cost accounting
on:
  push:
    paths:
      - 'data/system_costs/**'
      - 'data/electrification_pilot/**'
      - 'data/electrification_uncertainty/**'
      - 'data/spatial_proxy_study/**'
      - 'data/recovery_planning/**'
      - 'data/national_coupling/**'
      - 'research/system_costs/**'
      - '.github/workflows/system-costs.yml'
  pull_request:
    paths:
      - 'data/system_costs/**'
      - 'data/electrification_pilot/**'
      - 'data/electrification_uncertainty/**'
      - 'data/spatial_proxy_study/**'
      - 'data/recovery_planning/**'
      - 'data/national_coupling/**'
      - 'research/system_costs/**'
      - '.github/workflows/system-costs.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'pypsa==1.0.6' 'highspy==1.12.0' 'pandas>=2.3,<3' 'numpy>=2.1,<3' 'matplotlib>=3.9,<4' 'nbformat>=5.10,<6' 'nbclient>=0.10,<1' 'nbconvert>=7.16,<8' 'ipykernel>=6,<8'
      - run: python research/system_costs/check_costs.py
      - run: python research/system_costs/run_notebook.py --kernel python3
      - run: python research/system_costs/check_pilot.py
      - run: python research/system_costs/check_uncertainty.py
      - run: python research/system_costs/check_spatial_proxy.py
      - run: python research/system_costs/check_recovery.py
      - run: python research/system_costs/check_coupled.py

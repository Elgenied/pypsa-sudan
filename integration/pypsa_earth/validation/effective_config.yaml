version: 0.8.0
tutorial: false
countries:
- SD
run:
  name: sudan-2022-reference
  sector_name: ''
  shared_cutouts: true
  allow_scenario_failure: false
scenario:
  simpl:
  - ''
  ll:
  - c1.0
  clusters:
  - 10
  opts:
  - 3H
  planning_horizons:
  - 2020
  sopts:
  - 144h
snapshots:
  start: '2022-01-01'
  end: '2023-01-01'
  inclusive: left
enable:
  retrieve_databundle: true
  download_osm_data: true
  retrieve_cutout: false
  retrieve_cost_data: true
  retrieve_databundle_sector: false
  download_global_buildings: false
  build_cutout: true
  build_natura_raster: true
  progress_bar: false
  custom_busmap: false
load_options:
  source: gegis
  weather_year: 2022
  prediction_year: 2022
  scale: 1
atlite:
  nprocesses: 2
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.3
      dy: 0.3
    sudan-2022-era5:
      module: era5
      dx: 0.3
      dy: 0.3
  default: sudan-2022-era5
electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  conventional_carriers:
  - nuclear
  - oil
  - OCGT
  - CCGT
  - coal
  - lignite
  - geothermal
  - biomass
  renewable_carriers:
  - solar
  - onwind
  - hydro
  max_hours:
    battery: 6
    li-ion: 6
    lfp: 6
    vanadium: 10
    lair: 12
    pair: 24
    iron-air: 100
    H2: 168
  powerplants_filter: (DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2022
    or DateIn != DateIn)
  custom_powerplants:
    filepaths: []
    method: false
  estimate_renewable_capacities:
    stats: irena
    year: 2022
    p_nom_min: 1
    p_nom_max: false
    technology_mapping:
      Offshore:
      - offwind-ac
      - offwind-dc
      Onshore:
      - onwind
      PV:
      - solar
  base_voltage: 380.0
  voltages:
  - 132.0
  - 220.0
  - 300.0
  - 380.0
  - 500.0
  - 750.0
  hvdc_as_lines: false
  agg_p_nom_limits:
    file: data/agg_p_nom_minmax.csv
    include_existing: false
  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres: 0.02
    contingency: 0
renewable:
  onwind:
    cutout: sudan-2022-era5
    resource:
      method: wind
      turbine: Vestas_V112_3MW
    capacity_per_sqkm: 3
    copernicus:
      grid_codes:
      - 20
      - 30
      - 40
      - 60
      - 100
      - 111
      - 112
      - 113
      - 114
      - 115
      - 116
      - 121
      - 122
      - 123
      - 124
      - 125
      - 126
      distance: 1000
      distance_grid_codes:
      - 50
    natura: true
    potential: simple
    clip_p_max_pu: 0.01
    extendable: false
  offwind-ac:
    cutout: sudan-2022-era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_5MW_offshore
    capacity_per_sqkm: 2
    copernicus:
      grid_codes:
      - 80
      - 200
    natura: true
    max_depth: 50
    max_shore_distance: 30000
    potential: simple
    clip_p_max_pu: 0.01
    extendable: true
  offwind-dc:
    cutout: sudan-2022-era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_5MW_offshore
    capacity_per_sqkm: 3
    copernicus:
      grid_codes:
      - 80
      - 200
    natura: true
    max_depth: 50
    min_shore_distance: 30000
    potential: simple
    clip_p_max_pu: 0.01
    extendable: true
  solar:
    cutout: sudan-2022-era5
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal
    capacity_per_sqkm: 4.6
    correction_factor: 0.854337
    copernicus:
      grid_codes:
      - 20
      - 30
      - 40
      - 50
      - 60
      - 90
      - 100
    natura: true
    potential: simple
    clip_p_max_pu: 0.01
    extendable: false
  hydro:
    cutout: sudan-2022-era5
    hydrobasins_level: 6
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0
    carriers:
    - ror
    - PHS
    - hydro
    PHS_max_hours: 6
    hydro_max_hours: energy_capacity_totals_by_country
    hydro_max_hours_default: 6.0
    clip_min_inflow: 1.0
    extendable: false
    normalization:
      method: irena
      year: 2022
    multiplier: 1.0
    hydro_min_inflow_pu: 1.0
  csp:
    cutout: sudan-2022-era5
    resource:
      method: csp
      installation: SAM_solar_tower
    capacity_per_sqkm: 2.392
    copernicus:
      grid_codes:
      - 20
      - 30
      - 40
      - 60
      - 90
      distancing_codes:
      - 50
      distance_to_codes: 3000
    natura: true
    potential: simple
    clip_p_max_pu: 0.01
    extendable: true
    csp_model: advanced
co2:
  limit: 1487000000.0
  base: 1487000000.0
  emission_price: 0.0
  automatic_emission:
    enable: false
    base_year: 1990
  budget:
    enable: false
    override_co2opt: true
    base_value: limit
    year:
      2020: 1.0
      2025: 0.85
      2030: 0.7
      2035: 0.55
      2040: 0.4
      2045: 0.25
      2050: 0.1
costs:
  year: 2020
  technology_data_version: v0.13.2
  discountrate:
  - 0.071
  country_specific_data: ''
  cost_scenario: moderate
  financial_case: market
  output_currency: EUR
  default_exchange_rate: 0.7532
  future_exchange_rate_strategy: reference
  custom_future_exchange_rate: None
  rooftop_share: 0.14
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost:
    solar: 0.01
    onwind: 0.015
    offwind: 0.015
    hydro: 0.0
    H2: 0.0
    electrolysis: 0.0
    fuel cell: 0.0
    battery: 0.0
    battery inverter: 0.0
solving:
  solver:
    name: highs
    options: highs-default
  options:
    load_shedding: 100
    noisy_costs: false
    formulation: kirchhoff
    min_iterations: 4
    max_iterations: 6
    clip_p_max_pu: 0.01
    skip_iterations: true
    track_iterations: false
  solver_options:
    highs-default:
      threads: 4
      solver: ipm
      run_crossover: 'on'
      small_matrix_value: 1e-6
      large_matrix_value: 1e15
      primal_feasibility_tolerance: 1e-6
      dual_feasibility_tolerance: 1e-6
      ipm_optimality_tolerance: 1e-6
      parallel: 'on'
      random_seed: 123
    gurobi-default:
      threads: 4
      method: 2
      crossover: 0
      BarConvTol: 1.0e-06
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      NumericFocus: 3
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol: 1.0e-05
      FeasibilityTol: 0.0001
      OptimalityTol: 0.0001
      ObjScale: -0.5
      threads: 8
      Seed: 123
    gurobi-fallback:
      crossover: 0
      method: 2
      BarHomogeneous: 1
      BarConvTol: 1.0e-05
      FeasibilityTol: 1.0e-05
      OptimalityTol: 1.0e-05
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4
      solutiontype: 2
      barrier.convergetol: 1.0e-05
      feasopt.tolerance: 1.0e-06
    copt-default:
      Threads: 8
      LpMethod: 2
      Crossover: 0
    cbc-default: {}
    glpk-default: {}
  mem: 30000

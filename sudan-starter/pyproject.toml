[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsa-sudan"
version = "0.1.0"
description = "Preliminary, source-traceable regional dispatch model for Sudan"
requires-python = ">=3.11"
# PyPSA 1.0.6 map plotting expects NumPy-compatible string dtypes (pandas < 3).
dependencies = ["pypsa==1.0.6", "highspy==1.12.0", "pandas>=2.2,<3", "numpy", "geopandas", "matplotlib", "plotly", "requests", "networkx"]

[project.optional-dependencies]
notebooks = ["nbformat>=5", "nbclient>=0.10", "nbconvert>=7", "ipykernel>=6", "jupyterlab>=4", "cartopy>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsa-sudan"
version = "0.1.0"
description = "Preliminary, source-traceable regional dispatch model for Sudan"
requires-python = ">=3.11"
dependencies = ["pypsa==1.0.6", "highspy==1.12.0", "pandas", "numpy", "geopandas", "matplotlib", "plotly", "requests", "networkx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
